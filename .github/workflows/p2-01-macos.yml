# P2-01 · B 侧打包对照（macOS Apple Silicon runner，processor-only——不需要 20 GB 权重）
# 证据由 actions/upload-artifact 上传；硬错误（导入/处理器失败）才非零退出。
name: p2-01-processor-check
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "scripts/p2_01_processor_check.py"
      - "scripts/make_vendor.py"
      - ".github/workflows/p2-01-macos.yml"
permissions:
  contents: read
jobs:
  processor-check:
    runs-on: macos-latest   # Apple Silicon（arm64），真 MLX/Metal 环境
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖（mlx-vlm 钉 0.7.12；transformers≥5.14 随其解析）
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "mlx-vlm==0.7.12" librosa imageio imageio-ffmpeg
      - name: vendored L1 复生成 + SHA 断言（跨平台复现 make_vendor）
        run: python scripts/make_vendor.py
      - name: B 侧打包对照（processor-only）
        run: python scripts/p2_01_processor_check.py
      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-01-evidence
          path: p2-01-evidence/
          if-no-files-found: warn
